body::before{
  content:'';position:fixed;inset:0;
  background:linear-gradient(135deg,rgba(4,13,26,0.93) 0%,rgba(4,13,26,0.97) 100%);
  z-index:0;pointer-events:none;
}
*{position:relative;z-index:1;}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--primary2);border-radius:3px;}

.glass{
  background:var(--glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:14px;
}

/* ── AUTH ──────────────────────────────────────────────────────── */
#auth-screen{
  display:flex;justify-content:center;align-items:center;min-height:100vh;
  padding:20px;
}
.auth-card{
  width:100%;max-width:420px;
  padding:2.5rem;text-align:center;
  background:rgba(7,20,40,0.90);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:0 0 60px rgba(0,180,255,0.08);
}
.auth-logo{height:70px;object-fit:contain;margin-bottom:1.2rem;filter:drop-shadow(0 0 16px rgba(0,180,255,0.4));}
.auth-brand{
  font-size:1.4rem;font-weight:700;
  background:linear-gradient(90deg,var(--primary),var(--neon));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:.4rem;letter-spacing:.04em;
}
.auth-sub{font-size:.75rem;color:var(--muted);margin-bottom:1.8rem;text-transform:uppercase;letter-spacing:.1em;}
.auth-input{
  width:100%;padding:12px 16px;margin-bottom:12px;
  background:rgba(0,180,255,0.06);
  border:1px solid var(--border);
  border-radius:10px;color:var(--text);
  font-size:.92rem;outline:none;
  transition:border-color .2s;
}
.auth-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,180,255,0.1);}
.auth-input::placeholder{color:var(--muted);}
.btn-auth{
  width:100%;padding:13px;
  background:linear-gradient(90deg,var(--primary2),var(--primary));
  color:#fff;border:none;border-radius:10px;
  font-size:.95rem;font-weight:700;cursor:pointer;
  transition:.2s;letter-spacing:.04em;
  box-shadow:0 4px 20px rgba(0,180,255,0.25);
}
.btn-auth:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,180,255,0.35);}
.auth-toggle{margin-top:1rem;font-size:.8rem;color:var(--muted);}
.auth-toggle a{color:var(--neon);text-decoration:none;font-weight:600;}

/* ── HEADER ─────────────────────────────────────────────────────── */
#app-interface{display:none;}
header{
  background:rgba(4,13,26,0.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:12px 5%;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;
  flex-wrap:wrap;gap:10px;
}
.header-left{display:flex;align-items:center;gap:12px;}
.header-logo{height:40px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(0,180,255,0.3));}
.header-title{
  font-size:1.1rem;font-weight:700;
  background:linear-gradient(90deg,var(--primary),var(--neon));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.header-sub{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:1px;}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.online-dot{
  display:flex;align-items:center;gap:5px;
  font-size:.72rem;color:var(--neon);
}
.online-dot::before{
  content:'';width:7px;height:7px;border-radius:50%;
  background:var(--neon);box-shadow:0 0 6px var(--neon);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.avatar{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.75rem;flex-shrink:0;
}

/* ── OVERDUE BANNER ─────────────────────────────────────────────── */
#overdue-banner{
  background:linear-gradient(90deg,rgba(255,77,109,0.15),rgba(255,77,109,0.08));
  border-bottom:1px solid rgba(255,77,109,0.3);
  color:var(--red);padding:10px 5%;
  text-align:center;display:none;
  font-weight:600;font-size:.84rem;
}

/* ── TABS ───────────────────────────────────────────────────────── */
.tabs{
  display:flex;gap:6px;padding:14px 5% 8px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  background:rgba(4,13,26,0.5);
}
.tab-btn{
  background:transparent;
  border:1px solid rgba(0,180,255,0.2);
  color:var(--muted);padding:7px 16px;
  border-radius:8px;font-size:.79rem;font-weight:500;
  cursor:pointer;transition:.15s;font-family:inherit;
}
.tab-btn:hover{border-color:var(--primary);color:var(--primary);}
.tab-btn.active{
  background:linear-gradient(90deg,rgba(0,119,204,0.4),rgba(0,180,255,0.3));
  border-color:var(--primary);color:#fff;font-weight:700;
  box-shadow:0 0 12px rgba(0,180,255,0.2);
}

/* ── CONTAINER ──────────────────────────────────────────────────── */
.container{padding:1.4rem 5% 3rem;}

/* ── BUTTONS ────────────────────────────────────────────────────── */
button{cursor:pointer;font-family:inherit;transition:.15s;}
.btn-primary{
  background:linear-gradient(90deg,var(--primary2),var(--primary));
  color:#fff;border:none;padding:9px 20px;
  border-radius:9px;font-weight:700;font-size:.85rem;
  box-shadow:0 3px 12px rgba(0,180,255,0.25);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(0,180,255,0.35);}
.btn-neon{
  background:linear-gradient(90deg,var(--neon2),var(--neon));
  color:#04111f;border:none;padding:9px 20px;
  border-radius:9px;font-weight:700;font-size:.85rem;
  box-shadow:0 3px 12px rgba(0,255,136,0.2);
}
.btn-sm{background:none;border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:8px;font-size:.8rem;}
.btn-sm:hover{border-color:var(--primary);color:var(--primary);}
.btn-danger{background:none;border:1px solid rgba(255,77,109,0.3);color:var(--red);padding:7px 14px;border-radius:8px;font-size:.8rem;}
.btn-danger:hover{background:rgba(255,77,109,0.1);}

/* ── INPUTS ─────────────────────────────────────────────────────── */
input[type=text],input[type=password],input[type=date],select,textarea{
  width:100%;padding:10px 14px;
  background:rgba(0,180,255,0.05);
  border:1px solid var(--border);
  border-radius:9px;color:var(--text);
  font-family:inherit;font-size:.88rem;outline:none;
  transition:border-color .2s;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,180,255,0.08);}
input::placeholder,textarea::placeholder{color:var(--muted);}
select{background:rgba(4,13,26,0.95);}
select option{background:#071428;}
textarea{resize:vertical;line-height:1.5;}

/* ── KPI ────────────────────────────────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:1.4rem;}
.kpi-card{
  padding:1.2rem;text-align:center;
  background:var(--glass);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:14px;
  transition:.2s;
}
.kpi-card:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 4px 20px rgba(0,180,255,0.1);}
.kpi-icon{font-size:1.3rem;margin-bottom:5px;}
.kpi-n{font-size:1.9rem;font-weight:800;line-height:1;margin-bottom:3px;}
.kpi-lbl{font-size:.67rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}

/* ── PROGRESS BAR ───────────────────────────────────────────────── */
.prog-card{
  background:var(--glass);border:1px solid var(--border);
  border-radius:14px;padding:14px 18px;margin-bottom:1.4rem;
}
.prog-track{background:rgba(0,180,255,0.08);border-radius:6px;height:8px;overflow:hidden;margin-top:8px;}
.prog-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary2),var(--neon));transition:width .5s;}

/* ── CHARTS ─────────────────────────────────────────────────────── */
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:1.4rem;}
.chart-box{
  background:var(--glass);border:1px solid var(--border);
  border-radius:14px;padding:1.2rem;min-height:260px;
}

/* ── WEEK NAV ───────────────────────────────────────────────────── */
.week-nav{display:flex;gap:6px;align-items:center;margin-bottom:1rem;flex-wrap:wrap;}
.week-pill{
  background:transparent;border:1px solid rgba(0,180,255,0.2);
  color:var(--muted);padding:5px 14px;border-radius:20px;
  font-size:.76rem;cursor:pointer;font-family:inherit;
}
.week-pill:hover{border-color:var(--primary);color:var(--primary);}
.week-pill.active{
  background:linear-gradient(90deg,rgba(0,119,204,0.35),rgba(0,180,255,0.25));
  border-color:var(--primary);color:var(--primary);font-weight:700;
}

/* ── CONTROLS ───────────────────────────────────────────────────── */
.controls{
  display:flex;flex-wrap:wrap;gap:8px;
  align-items:center;margin-bottom:1.2rem;
  padding:12px 14px;
  background:var(--glass);border:1px solid var(--border);border-radius:12px;
}
.controls input,.controls select{margin:0;flex:1;min-width:140px;}

/* ── TASK GRID ──────────────────────────────────────────────────── */
.task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.task-card{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:14px;padding:1.2rem;
  cursor:pointer;transition:.2s;
  display:flex;flex-direction:column;gap:8px;
  position:relative;overflow:hidden;
}
.task-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--primary),var(--neon));
  opacity:0;transition:.2s;
}
.task-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,180,255,0.12);}
.task-card:hover::before{opacity:1;}
.task-card.status-Pending{border-left:3px solid var(--red);}
.task-card.status-Progress{border-left:3px solid var(--primary);}
.task-card.status-Done{border-left:3px solid var(--neon);opacity:.7;}
.task-card.overdue{border-color:rgba(255,77,109,0.4);}
.priority-badge{
  position:absolute;top:10px;right:10px;
  padding:3px 9px;border-radius:20px;
  font-size:.65rem;font-weight:700;text-transform:uppercase;
}
.task-title{font-size:.92rem;font-weight:600;padding-right:64px;line-height:1.3;}
.task-desc{font-size:.78rem;color:var(--muted);line-height:1.4;}
.task-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.badge{padding:3px 9px;border-radius:20px;font-size:.65rem;font-weight:600;text-transform:uppercase;}

/* ── PERSONAL STATS ─────────────────────────────────────────────── */
.personal-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:1.2rem;}
.pstat{
  background:var(--glass);border:1px solid var(--border);border-radius:12px;
  padding:1rem;text-align:center;transition:.2s;
}
.pstat:hover{border-color:var(--primary);}
.pstat-n{font-size:1.6rem;font-weight:800;line-height:1;}
.pstat-lbl{font-size:.67rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:3px;}

/* ── WEEK HISTORY ───────────────────────────────────────────────── */
.week-header{
  display:flex;align-items:center;gap:10px;margin-bottom:10px;margin-top:20px;
}
.week-line{flex:1;height:1px;background:var(--border);}
.week-label{
  font-size:.72rem;color:var(--muted);white-space:nowrap;
  padding:4px 12px;border:1px solid var(--border);border-radius:20px;
  background:var(--surface2);
}

/* ── MODAL ──────────────────────────────────────────────────────── */
.modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.85);z-index:1000;
  justify-content:center;align-items:center;padding:16px;
}
.modal-box{
  width:100%;max-width:680px;max-height:92vh;overflow-y:auto;
  padding:1.8rem;
  background:rgba(4,13,26,0.97);
  border:1px solid var(--border);border-radius:18px;
  display:flex;flex-direction:column;gap:14px;
  box-shadow:0 0 60px rgba(0,180,255,0.1);
}
.modal-title{
  font-size:1.1rem;font-weight:700;
  background:linear-gradient(90deg,var(--primary),var(--neon));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.modal-actions{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;}
.section-lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px;}
.photos-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.photo-thumb{width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:pointer;flex-shrink:0;}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.comment-item{background:rgba(0,180,255,0.05);border-radius:9px;padding:8px 12px;margin-bottom:6px;border-left:2px solid var(--primary);}
.comment-user{font-size:.78rem;font-weight:700;color:var(--primary);}
.comment-text{font-size:.82rem;color:var(--text);margin-top:2px;line-height:1.4;}
.comment-time{font-size:.66rem;color:var(--muted);}
.history-item{font-size:.73rem;color:var(--muted);padding:3px 0;border-bottom:1px solid rgba(0,180,255,0.06);}

/* ── LIGHTBOX ───────────────────────────────────────────────────── */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:2000;align-items:center;justify-content:center;cursor:zoom-out;}
#lightbox.show{display:flex;}
#lightbox img{max-width:90vw;max-height:88vh;border-radius:10px;}
#lb-close{position:absolute;top:18px;right:22px;color:#fff;font-size:1.6rem;cursor:pointer;background:none;border:none;}

/* ── LOADING ────────────────────────────────────────────────────── */
#loadingInd{
  position:fixed;bottom:24px;right:24px;
  background:linear-gradient(90deg,var(--primary2),var(--primary));
  color:#fff;padding:10px 20px;border-radius:20px;
  font-size:.82rem;font-weight:600;display:none;
  align-items:center;gap:8px;z-index:500;
  box-shadow:0 4px 20px rgba(0,180,255,0.3);
}

/* ── EMPTY ──────────────────────────────────────────────────────── */
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:.9rem;}

@media(max-width:640px){
  .form-grid,.form-grid-3{grid-template-columns:1fr;}
  .charts-grid{grid-template-columns:1fr;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .container{padding:1rem 3% 2rem;}
  header{padding:10px 3%;}
  .tabs{padding:10px 3% 6px;}
}
</style>
</head>

const escH=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate=d=>{if(!d)return'';const[y,m,day]=d.split('-');return`${day}/${m}/${y}`;}
const fmtDT=ts=>{if(!ts)return'';const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleDateString('es-CL')+' '+d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});}
const isOD=(d,s)=>{if(!d||s==='Done')return false;const t=new Date();t.setHours(0,0,0,0);return new Date(d+'T00:00:00')<t;}

async function compressImg(file,maxW=800){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.7));
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(file);
  });
}

// ── Filters ───────────────────────────────────────────────────────
function filterTasks(tasks){
  let f=[...tasks];
  if(!isAdmin())f=f.filter(t=>t.assignedTo===currentUser.username||t.createdBy===currentUser.username);
  if(statusFilter!=='todas'){
    const map={pendiente:'Pending',progreso:'Progress',listo:'Done'};
    f=f.filter(t=>t.status===map[statusFilter]);
  }
  if(areaFilter!=='todas')f=f.filter(t=>t.area===areaFilter);
  if(weekFilter!=='all'){
    const now=new Date();
    let start,end;
    if(weekFilter==='this-week'){
      start=new Date(now);start.setDate(now.getDate()-now.getDay());start.setHours(0,0,0,0);end=new Date();
    }else{
      start=new Date(now);start.setDate(now.getDate()-now.getDay()-7);start.setHours(0,0,0,0);
      end=new Date(start);end.setDate(start.getDate()+6);end.setHours(23,59,59,999);
    }
    f=f.filter(t=>{
      const d=t.createdAt?.toDate?t.createdAt.toDate():new Date(t.createdAt||0);
      return d>=start&&d<=end;
    });
  }
  const search=document.getElementById('searchInput')?.value?.toLowerCase()||'';
  if(search)f=f.filter(t=>(t.title||'').toLowerCase().includes(search)||(t.desc||'').toLowerCase().includes(search)||(t.assignedTo||'').toLowerCase().includes(search));
  return f;
}

// ── Historial ─────────────────────────────────────────────────────
function renderHistorial(c){
  const my=allTasks.filter(t=>t.assignedTo===currentUser.username||t.createdBy===currentUser.username);
  const done=my.filter(t=>t.status==='Done');
  const byWeek={};
  done.forEach(t=>{
    const d=t.createdAt?.toDate?t.createdAt.toDate():new Date(t.createdAt||0);
    const ws=new Date(d);ws.setDate(d.getDate()-d.getDay());ws.setHours(0,0,0,0);
    const key=ws.toISOString().split('T')[0];
    if(!byWeek[key])byWeek[key]=[];
    byWeek[key].push(t);
  });
  const keys=Object.keys(byWeek).sort((a,b)=>b.localeCompare(a));
  let html=`<h3 style="background:linear-gradient(90deg,var(--primary),var(--neon));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:1.1rem;margin-bottom:1rem">
    📋 Mi Historial — ${escH(currentUser.username)}</h3>`;
  if(!keys.length){
    html+=`<div class="empty">📭<br>Aún no tienes tareas completadas</div>`;
  }else{
    html+=`<div style="margin-bottom:1rem;font-size:.82rem;color:var(--muted)">Total completadas: <strong style="color:var(--neon)">${done.length}</strong></div>`;
    keys.forEach(key=>{
      const wtasks=byWeek[key];
      const ws=new Date(key+'T00:00:00');
      const we=new Date(ws);we.setDate(ws.getDate()+6);
      const lbl=`${ws.toLocaleDateString('es-CL',{day:'numeric',month:'short'})} — ${we.toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'})}`;
      html+=`
      <div class="week-header">
        <div class="week-line"></div>
        <span class="week-label">📅 ${lbl} &nbsp;·&nbsp; <strong style="color:var(--neon)">${wtasks.length} completadas</strong></span>
        <div class="week-line"></div>
      </div>
      <div class="task-grid">${wtasks.map(t=>taskCardHTML(t)).join('')}</div>`;
    });
  }
  c.innerHTML=html;
}

function buildCharts(tasks){
  Object.values(charts).forEach(ch=>{try{ch.destroy();}catch(e){}});charts={};
  const pend=tasks.filter(t=>t.status==='Pending').length;
  const prog=tasks.filter(t=>t.status==='Progress').length;
  const done=tasks.filter(t=>t.status==='Done').length;
  const chartDefaults={responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:'#e8f4ff',font:{size:11}}}}};

  const c1=document.getElementById('statusChart')?.getContext('2d');
  if(c1)charts.s=new Chart(c1,{type:'doughnut',
    data:{labels:['Pendiente','En Progreso','Listo'],
           datasets:[{data:[pend,prog,done],backgroundColor:['#ff4d6d','#00b4ff','#00ff88'],borderWidth:0,hoverOffset:6}]},
    options:{...chartDefaults,cutout:'65%',
      plugins:{...chartDefaults.plugins,title:{display:true,text:'Estado de Tareas',color:'#00b4ff',font:{size:13,weight:'bold'}}}}
  });

  const c2=document.getElementById('areaChart')?.getContext('2d');
  if(c2)charts.a=new Chart(c2,{type:'bar',
    data:{labels:AREAS,datasets:[{label:'Tareas',data:AREAS.map(a=>tasks.filter(t=>t.area===a).length),
      backgroundColor:['rgba(0,180,255,0.7)','rgba(0,255,136,0.7)','rgba(132,94,247,0.7)'],borderRadius:6}]},
    options:{...chartDefaults,
      scales:{y:{beginAtZero:true,ticks:{color:'#e8f4ff'},grid:{color:'rgba(0,180,255,0.06)'}},x:{ticks:{color:'#e8f4ff'}}},
      plugins:{...chartDefaults.plugins,legend:{display:false},title:{display:true,text:'Tareas por Área',color:'#00b4ff',font:{size:13,weight:'bold'}}}}
  });

  const weekLabels=[],weekData=[],weekDoneData=[];
  for(let i=5;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-d.getDay()-i*7);d.setHours(0,0,0,0);
    const end=new Date(d);end.setDate(d.getDate()+6);end.setHours(23,59,59);
    weekLabels.push(`S${6-i}`);
    const wt=tasks.filter(t=>{const td=t.createdAt?.toDate?t.createdAt.toDate():new Date(t.createdAt||0);return td>=d&&td<=end;});
    weekData.push(wt.length);
    weekDoneData.push(wt.filter(t=>t.status==='Done').length);
  }
  const c3=document.getElementById('weekChart')?.getContext('2d');
  if(c3)charts.w=new Chart(c3,{type:'line',
    data:{labels:weekLabels,datasets:[
      {label:'Total',data:weekData,borderColor:'#00b4ff',backgroundColor:'rgba(0,180,255,0.08)',tension:.4,fill:true,pointBackgroundColor:'#00b4ff'},
      {label:'Completadas',data:weekDoneData,borderColor:'#00ff88',backgroundColor:'rgba(0,255,136,0.08)',tension:.4,fill:true,pointBackgroundColor:'#00ff88'}
    ]},
    options:{...chartDefaults,
      scales:{y:{beginAtZero:true,ticks:{color:'#e8f4ff'},grid:{color:'rgba(0,180,255,0.06)'}},x:{ticks:{color:'#e8f4ff'}}},
      plugins:{...chartDefaults.plugins,title:{display:true,text:'Actividad Semanal',color:'#00b4ff',font:{size:13,weight:'bold'}}}}
  });

  const people=[...new Set(tasks.map(t=>t.assignedTo).filter(Boolean))].slice(0,10);
  const c4=document.getElementById('personChart')?.getContext('2d');
  if(c4)charts.p=new Chart(c4,{type:'bar',
    data:{labels:people,datasets:[
      {label:'Pendientes',data:people.map(p=>tasks.filter(t=>t.assignedTo===p&&t.status==='Pending').length),backgroundColor:'rgba(255,77,109,0.75)',borderRadius:4},
      {label:'En Progreso',data:people.map(p=>tasks.filter(t=>t.assignedTo===p&&t.status==='Progress').length),backgroundColor:'rgba(0,180,255,0.75)',borderRadius:4},
      {label:'Completadas',data:people.map(p=>tasks.filter(t=>t.assignedTo===p&&t.status==='Done').length),backgroundColor:'rgba(0,255,136,0.75)',borderRadius:4}
    ]},
    options:{...chartDefaults,
      scales:{y:{beginAtZero:true,ticks:{color:'#e8f4ff'},grid:{color:'rgba(0,180,255,0.06)'}},x:{ticks:{color:'#e8f4ff',maxRotation:30}}},
      plugins:{...chartDefaults.plugins,title:{display:true,text:'Rendimiento por Persona',color:'#00b4ff',font:{size:13,weight:'bold'}}}}
  });
}

  const od=isOD(t.deadline,t.status);
  const sc=getSColor(t.status),pc=getPColor(t.priority);
  return`
  <div class="task-card status-${t.status}${od?' overdue':''}" onclick="openEditModal('${t.id}')">
    <span class="priority-badge" style="background:${pc}22;color:${pc};border:1px solid ${pc}44">${t.priority||'Media'}</span>
    <div class="task-title">${escH(t.title)}</div>
    ${t.desc?`<div class="task-desc">${escH((t.desc||'').substring(0,80))}${(t.desc||'').length>80?'...':''}</div>`:''}
    <div class="task-meta">
      <span class="badge" style="background:${sc}18;color:${sc}">${getSLabel(t.status)}</span>
      ${t.area?`<span class="badge" style="background:rgba(0,180,255,0.1);color:var(--accent)">${escH(t.area)}</span>`:''}
      ${t.deadline?`<span style="font-size:.72rem;color:${od?'var(--red)':'var(--muted)'}">${od?'⚠ ':''}${fmtDate(t.deadline)}</span>`:''}
    </div>
    <div class="task-meta">
      ${t.assignedTo?`<span style="display:inline-flex;align-items:center;gap:4px">
        <div style="width:18px;height:18px;border-radius:50%;background:${avColor(t.assignedTo)}33;color:${avColor(t.assignedTo)};display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:700">${(t.assignedTo[0]||'?').toUpperCase()}</div>
        <span style="font-size:.72rem;color:var(--muted)">${escH(t.assignedTo)}</span></span>`:''}
      ${(t.photos||[]).length?`<span style="font-size:.7rem;color:var(--primary)">📷 ${(t.photos||[]).length}</span>`:''}
      ${t.resultPhoto?`<span style="font-size:.7rem;color:var(--neon)">✅📷</span>`:''}
      ${(t.comments||[]).length?`<span style="font-size:.7rem;color:var(--purple)">💬 ${(t.comments||[]).length}</span>`:''}
    </div>
  </div>`;
}

// ── Task Modal ────────────────────────────────────────────────────
let editingId=null, newPhotosB64=[];

window.openTaskModal=()=>{editingId=null;newPhotosB64=[];showModal(null);};
window.openEditModal=id=>{
  const t=allTasks.find(t=>t.id===id);if(!t)return;
  editingId=id;newPhotosB64=[];showModal(t);
};

function showModal(t){
  const isEdit=!!t;
  const users=allUsers.map(u=>`<option value="${u.username}" ${t?.assignedTo===u.username?'selected':''}>${escH(u.username)}</option>`).join('');
  const photosHTML=(t?.photos||[]).map(p=>{
    const src=p.data||p.url||p;
    return`<div class="photo-thumb" onclick="openLB('${src}')"><img src="${src}" alt=""></div>`;
  }).join('');

  document.body.insertAdjacentHTML('beforeend',`
  <div id="taskModal" class="modal" style="display:flex">
    <div class="modal-box">
      <div class="modal-title">${isEdit?'✏️ Editar Tarea':'✦ Nueva Tarea'}</div>
      <div class="form-grid">
        <input type="text" id="m-title" placeholder="Título de la tarea" value="${escH(t?.title||'')}" required>
        <select id="m-area">${AREAS.map(a=>`<option value="${a}" ${t?.area===a?'selected':''}>${a}</option>`).join('')}</select>
      </div>
      <textarea id="m-desc" placeholder="Descripción detallada…" rows="3">${escH(t?.desc||'')}</textarea>
      <div class="form-grid-3">
        <select id="m-priority">${['Baja','Media','Alta'].map(p=>`<option value="${p}" ${t?.priority===p?'selected':''}>${p}</option>`).join('')}</select>
        <input type="date" id="m-deadline" value="${t?.deadline||''}">
        <select id="m-assignee">${users}</select>
      </div>
      ${isEdit?`<div><div class="section-lbl">Estado</div>
        <select id="m-status">${['Pending','Progress','Done'].map(s=>`<option value="${s}" ${t?.status===s?'selected':''}>${getSLabel(s)}</option>`).join('')}</select>
      </div>`:''}
      <div>
        <div class="section-lbl">📷 Fotos de referencia / proceso (${(t?.photos||[]).length})</div>
        <div class="photos-row" id="m-photos-row">${photosHTML}</div>
        <input type="file" id="m-photos-input" accept="image/*" multiple style="margin-top:8px" onchange="handlePhotoInput(this)">
      </div>
      ${isEdit&&(t?.status==='Progress'||t?.status==='Done')?`
      <div style="border:1px solid rgba(0,255,136,0.25);border-radius:10px;padding:12px;background:rgba(0,255,136,0.04)">
        <div class="section-lbl" style="color:var(--neon)">✅ Foto del resultado</div>
        ${t?.resultPhoto?`<div class="photos-row"><div class="photo-thumb" onclick="openLB('${t.resultPhoto}')"><img src="${t.resultPhoto}" alt=""></div></div>`:''}
        <input type="file" id="m-result-photo" accept="image/*" style="margin-top:8px">
      </div>`:''}
      ${isEdit?`
      <div>
        <div class="section-lbl">💬 Comentarios (${(t?.comments||[]).length})</div>
        <div style="max-height:180px;overflow-y:auto;margin-bottom:8px">
          ${(t?.comments||[]).map(c=>`<div class="comment-item">
            <div class="comment-user">${escH(c.user||c.by||'')} <span class="comment-time">${c.date||fmtDT(c.at)}</span></div>
            <div class="comment-text">${escH(c.text)}</div></div>`).join('')}
        </div>
        <div style="display:flex;gap:6px">
          <input type="text" id="m-new-comment" placeholder="Escribir comentario…" style="margin:0;flex:1">
          <button class="btn-primary" style="width:auto" onclick="submitComment()">Enviar</button>
        </div>
      </div>
      <div>
        <div class="section-lbl">🕓 Historial</div>
        <div style="max-height:120px;overflow-y:auto">
          ${(t?.history||[]).slice().reverse().map(h=>`<div class="history-item">${escH(typeof h==='string'?h:h.action||'')}</div>`).join('')}
        </div>
      </div>`:''}
      <div class="modal-actions">
        <button class="btn-neon" onclick="saveTask()">${isEdit?'💾 Guardar cambios':'+ Crear Tarea'}</button>
        <button class="btn-sm" onclick="closeTaskModal()">Cancelar</button>
        ${isEdit?`<button class="btn-danger" onclick="confirmDelete('${t.id}')">🗑 Eliminar</button>`:''}
      </div>
    </div>
  </div>`);
}

window.handlePhotoInput=async input=>{
  for(const f of Array.from(input.files)){
    const b64=await compressImg(f);
    newPhotosB64.push({data:b64,name:f.name});
    document.getElementById('m-photos-row').insertAdjacentHTML('beforeend',
      `<div class="photo-thumb" onclick="openLB('${b64}')"><img src="${b64}" alt=""></div>`);
  }
  input.value='';
};

window.submitComment=async()=>{
  if(!editingId)return;
  const el=document.getElementById('m-new-comment');
  const txt=el.value.trim();if(!txt)return;
  const t=allTasks.find(t=>t.id===editingId);if(!t)return;
  const c={user:currentUser.username,text:txt,date:new Date().toLocaleString('es-CL')};
  const h=[...(t.history||[]),`${new Date().toLocaleString('es-CL')}: ${currentUser.username} comentó`];
  await updateDoc(doc(db,'tasks',editingId),{comments:[...(t.comments||[]),c],history:h});
  el.value='';
};

window.saveTask=async()=>{
  const title=document.getElementById('m-title').value.trim();
  if(!title)return alert('El título es obligatorio');
  const data={
    title,
    desc:document.getElementById('m-desc').value.trim(),
    area:document.getElementById('m-area').value,
    priority:document.getElementById('m-priority').value,
    deadline:document.getElementById('m-deadline').value,
    assignedTo:document.getElementById('m-assignee').value,
    updatedAt:serverTimestamp()
  };
  setLoading(true);
  try{
    if(editingId){
      const t=allTasks.find(t=>t.id===editingId);
      data.status=document.getElementById('m-status').value;
      if(newPhotosB64.length)data.photos=[...(t.photos||[]),...newPhotosB64];
      const rp=document.getElementById('m-result-photo')?.files?.[0];
      if(rp)data.resultPhoto=await compressImg(rp);
      const changes=[];
      if(data.title!==t.title)changes.push('Título modificado');
      if(data.status!==t.status)changes.push(`Estado → ${getSLabel(data.status)}`);
      if(data.assignedTo!==t.assignedTo)changes.push(`Reasignado a ${data.assignedTo}`);
      if(data.priority!==t.priority)changes.push(`Prioridad → ${data.priority}`);
      const h=[...(t.history||[])];
      if(changes.length)h.push(`${new Date().toLocaleString('es-CL')}: ${currentUser.username} editó — ${changes.join(', ')}`);
      data.history=h;
      await updateDoc(doc(db,'tasks',editingId),data);
    }else{
      data.status='Pending';
      data.createdBy=currentUser.username;
      data.createdAt=serverTimestamp();
      data.photos=newPhotosB64;
      data.comments=[];
      data.history=[`${new Date().toLocaleString('es-CL')}: Creada por ${currentUser.username}`];
      await addDoc(collection(db,'tasks'),data);
    }
    closeTaskModal();
  }catch(e){alert('Error: '+e.message);console.error(e);}
  setLoading(false);
};

window.confirmDelete=async id=>{
  if(!confirm('¿Eliminar esta tarea definitivamente?'))return;
  await deleteDoc(doc(db,'tasks',id));
  closeTaskModal();
};

window.closeTaskModal=()=>{document.getElementById('taskModal')?.remove();editingId=null;newPhotosB64=[];};

// ── Misc ──────────────────────────────────────────────────────────
function checkOverdue(){
  const my=isAdmin()?allTasks:allTasks.filter(t=>t.assignedTo===currentUser.username||t.createdBy===currentUser.username);
  document.getElementById('overdue-banner').style.display=my.some(t=>isOD(t.deadline,t.status))?'block':'none';
}

window.openLB=src=>{document.getElementById('lb-img').src=src;document.getElementById('lightbox').classList.add('show');};
window.closeLB=()=>document.getElementById('lightbox').classList.remove('show');

if(currentUser)initApp();
</script>
</body>
</html>
